# Cấu hình chạy chính (2 GPU: 2 replica vLLM). Ghi đè URL/model bằng env DATAMATE_LLM_URLS / DATAMATE_LLM_MODEL.
name: baseline
cache_dir: /tmp/datamate_cache
workers: 8                    # process pool build catalog + số sandbox chạy song song
question_concurrency: 48      # số câu xử lý đồng thời (I/O bound: chờ LLM / sandbox)
time_budget_sec: 19440        # 5.4h: quá mốc thì chỉ chạy tầng A, còn lại abstain (giới hạn BTC 6h)
sandbox_timeout_sec: 30
max_repair_rounds: 1
llm:
  enabled: true
  base_urls: ["http://127.0.0.1:8000/v1", "http://127.0.0.1:8001/v1"]
  model: qwen
  temperature: 0.0
  seed: 42
  max_tokens: 2048
  timeout_sec: 180
  max_concurrency: 64
  guided_json: true
  disable_thinking: true
  wait_ready_sec: 900
strategies:
  - {name: guard, weight: 1.0}
  - {name: rule_plan, weight: 1.0, options: {unanswerable_weight: 0.5}}
  - {name: llm_plan, weight: 0.6, options: {skip_if_rule_conf: 0.8}}
  - {name: llm_code, weight: 0.5, samples: 2, options: {when: fallback, skip_if_rule_conf: 0.8, temperatures: [0.0, 0.5], unanswerable_factor: 0.6}}
decision:
  min_score: 0.5
  min_share: 0.6
  unanswerable_min_score: 0.9
