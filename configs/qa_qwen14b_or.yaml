# v3.1.2 — Qwen3-14B qua OpenRouter (đo CHẤT LƯỢNG của đúng model nộp bài; thời gian không đại diện cho 2×5090).
# Khác qa_qwen14b.yaml chỉ ở địa chỉ / khoá / tham số nhà cung cấp.  export OPENROUTER_API_KEY=...
name: qa_qwen14b_or
cache_dir: /tmp/datamate_cache
workers: 4
question_concurrency: 8
time_budget_sec: 19800
sandbox_timeout_sec: 30
llm:
  enabled: true
  base_urls: ["https://openrouter.ai/api/v1"]
  model: qwen/qwen3-14b
  api_key_env: OPENROUTER_API_KEY
  health_check: false
  temperature: 0.3
  seed: 42
  max_tokens: 1500
  timeout_sec: 300
  max_concurrency: 96
  guided_json: false
  disable_thinking: false        # OpenRouter: tắt suy nghĩ bằng extra_body.reasoning
  retries: 5
  extra_body: {reasoning: {enabled: false}, provider: {order: [DeepInfra], allow_fallbacks: true}}
mapping_llm:
  enabled: true
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3-14b
  api_key_env: OPENROUTER_API_KEY
  json_mode: prompt
  disable_thinking: false
  extra_body: {reasoning: {enabled: false}}
  max_tokens: 4096
  timeout_sec: 120
  retries: 3
  min_conf: 0.8
canon_q:
  enabled: true
  concurrency: 16
  max_tokens: 512
  temperature: 0.0
strategies:
  - {name: guard, weight: 1.0}
  - {name: rule_plan, weight: 1.0, options: {unanswerable_weight: 0.5}}
  - name: agent
    weight: 1.0
    samples: 3
    options:
      styles: [canon_pandas, canon_check, sql]
      temperatures: [0.3, 0.6, 0.8]
      max_steps: 10                  # v3.3.0: lần chạy public 8 bước vẫn dồn 240 lời giải ở bước cuối, 48 hết lượt
      max_tokens_step: 1500
      cell_timeout: 30
      shop_notes: false            # v3.1.1: hỏng JSON ở 11/13 shop với GLM, tốn 1 lượt suy luận mỗi shop
      rule_hints: true
      rule_hints_k: 6                # v3.1.2: số dòng luật liên quan đặt ngay cạnh câu hỏi
      code_lint: true                # v3.1.2: code chưa xét trạng thái đơn / so chuỗi đoán -> bắt kiểm tra lại 1 lần
      unanswerable_factor: 1.0
      kernel: {per_shop: 6, max_workers: 24, mem_gb: 12}
      context_tokens: 32768
      chars_per_token: 1.8
      cards_chars: 5000              # v3.1.2: ngữ cảnh gọn cho model nhỏ
      readme_chars: 3000
      history_chars: 36000
decision:
  min_score: 0.8
  min_share: 0.6
  unanswerable_min_score: 0.9
  calibration_path: configs/calibration.yaml
  unexplained_factor: [1.0, 0.5, 0.0]
  health_factor: {recon_mismatch: 0.5, header_rows: 1.0, duplicate_sources: 1.0}
  recon_mismatch_max: 0.2
  type_contract: true
  # v3.1.0
  llm_only_abstained: true       # đáp án tầng A giữ nguyên; LLM chỉ chạy cho câu tầng A bỏ trống
  llm_keep_tier_a: true
  llm_answer_types: null         # LLM được đưa mọi kiểu đáp án (đếm phiếu là chốt chặn)
  llm_reject_zero: true          # đáp án 0 / 0% / ±100% chỉ từ LLM -> bỏ trống (thận trọng)
  llm_vote: consensus
  min_votes: 3                   # v3.2.2: Qwen3-14B — thử 30 câu: 3/3 cho 5 đúng / 0 sai, 2/3 cho 6 đúng / 3 sai
  unanswerable_min_votes: 3
